# Dedicated Alembic Configuration for Traditional Billing
# Isolated from Fast Billing alembic.ini

[alembic]
script_location = %(here)s/traditional_migrations
prepend_sys_path = .
version_locations = %(here)s/traditional_migrations/versions
version_table = traditional_alembic_version
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
